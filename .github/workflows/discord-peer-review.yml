name: Discord Peer Review Alert

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  notify-discord:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Send peer review alert
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;

            if (!webhook) {
              core.setFailed('DISCORD_WEBHOOK_URL is not configured.');
              return;
            }

            const pr = context.payload.pull_request;

            const message =
              `**Ready for peer-review**\n\n` +
              `PR #${pr.number} - ${pr.title}\n` +
              `Author: ${pr.user.login}\n` +
              `${pr.html_url}`;

            const response = await fetch(webhook, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                content: message,
                allowed_mentions: {
                  parse: []
                }
              })
            });

            if (!response.ok) {
              core.setFailed(
                `Discord returned ${response.status}: ${await response.text()}`
              );
            }
